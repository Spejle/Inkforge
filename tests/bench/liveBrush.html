<!doctype html>
<html>
<head><meta charset="utf-8"><title>Live brush benchmark</title></head>
<body style="margin:0;background:#222">
<script>
  // the parchment grain uses Math.random; seed it so two builds render the same pixels and can be diffed
  (() => { let a = 0x9e3779b9; Math.random = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
</script>
<script type="module" src="./liveBrush.js"></script>
</body>
</html>
